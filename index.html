<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VtM Hunger Dice</title>
<style>
  :root {
    --bg: #17171a;
    --panel: #202024;
    --text: #eee;
    --muted: #9a9aa2;
    --border: #33333a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  .controls {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  label { width: 90px; color: var(--muted); font-size: 12px; }
  .stepper { display: flex; align-items: center; gap: 4px; flex: 1; }
  .stepper button {
    width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--border);
    background: #2a2a30; color: var(--text); cursor: pointer; font-size: 14px; line-height: 1;
  }
  .stepper button:hover { background: #35353c; }
  .stepper input[type=number] {
    width: 44px; text-align: center; background: #141416; color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 2px;
  }
  input[type=color] {
    width: 26px; height: 26px; border: none; border-radius: 4px; padding: 0; background: none; cursor: pointer;
  }
  .swatch-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }

  .roll-btn {
    width: 100%; padding: 10px; margin-top: 4px; border-radius: 6px; border: none;
    background: linear-gradient(180deg, #7a1020, #5a0c18); color: #fff; font-weight: 600;
    letter-spacing: 0.5px; cursor: pointer; font-size: 14px;
  }
  .roll-btn:hover { filter: brightness(1.1); }
  .roll-btn:active { filter: brightness(0.9); }
  .roll-btn:disabled { opacity: 0.5; cursor: default; }

  .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
  }
  .entry {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .entry-header {
    display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;
  }
  .entry-player { font-weight: 600; }
  .entry-time { color: var(--muted); font-size: 11px; }
  .entry-body { display: flex; align-items: stretch; gap: 10px; }
  .dice-row { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 5px; flex: 1; }

  .tally-box {
    flex-shrink: 0; width: 58px; border-radius: 8px; border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 4px 2px;
  }
  .tally-number { font-size: 24px; font-weight: 800; line-height: 1; color: var(--text); }
  .tally-tag {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
    text-align: center; line-height: 1.15;
  }
  .tally-box.crit { border-color: #f2c14e; }
  .tally-box.crit .tally-number, .tally-box.crit .tally-tag { color: #f2c14e; }
  .tally-box.messy { border-color: #f2895f; }
  .tally-box.messy .tally-number, .tally-box.messy .tally-tag { color: #f2895f; }
  .tally-box.bestial { border-color: #e35b5b; }
  .tally-box.bestial .tally-number, .tally-box.bestial .tally-tag { color: #e35b5b; }

  .die {
    width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff; border: 1px solid rgba(255,255,255,0.15);
    position: relative;
  }
  /* individual success die (6-9 or an unpaired 10) */
  .die.success { box-shadow: 0 0 0 2px #3fae5c; }
  /* paired 10s = critical */
  .die.crit { box-shadow: 0 0 0 2px #f2c14e; }
  /* hunger die showing a 1 - styled as a "dead" die: dark outline, dark number */
  .die.hungerone { box-shadow: 0 0 0 2px #000000; color: #000000; }
  /* both a hunger-1 AND part of a crit pair (rare but possible visually stack) */
  .die.crit.hungerone { box-shadow: 0 0 0 2px #f2c14e, 0 0 0 4px #000000; }

  .die.selectable { cursor: pointer; }
  .die.selectable:hover { filter: brightness(1.25); }
  .die.selected { outline: 2px solid #4da6ff; outline-offset: 1px; }

  @keyframes diceIn {
    0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
    60% { transform: scale(1.1) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .die.die-animate { animation: diceIn 0.32s cubic-bezier(.34,1.56,.64,1) both; }

  .reroll-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .reroll-btn {
    padding: 5px 10px; border-radius: 6px; border: 1px solid #4da6ff; background: rgba(77,166,255,0.12);
    color: #bfe0ff; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .reroll-btn:hover { background: rgba(77,166,255,0.22); }
  .reroll-hint { color: var(--muted); font-size: 11px; }

  .empty-state { color: var(--muted); text-align: center; margin-top: 30px; font-size: 12.5px; }
  .log-toolbar {
    display: flex; justify-content: flex-end; padding: 4px 12px; border-top: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  .log-toolbar button {
    background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 4px;
  }
  .log-toolbar button:hover { color: #f29b9b; }
</style>
</head>
<body>
<div id="app">
  <div class="controls">
    <div class="row">
      <label for="poolInput">Pool</label>
      <div class="stepper">
        <button id="poolMinus">−</button>
        <input id="poolInput" type="number" min="1" max="20" value="5" />
        <button id="poolPlus">+</button>
      </div>
      <span class="swatch-label"><input id="poolColor" type="color" value="#2b2b2f" />pool</span>
    </div>
    <div class="row">
      <label for="hungerInput">Hunger</label>
      <div class="stepper">
        <button id="hungerMinus">−</button>
        <input id="hungerInput" type="number" min="0" max="5" value="1" />
        <button id="hungerPlus">+</button>
      </div>
      <span class="swatch-label"><input id="hungerColor" type="color" value="#a5192b" />hunger</span>
    </div>
    <button class="roll-btn" id="rollBtn">ROLL POOL</button>
    <div class="hint" id="hint">Hunger dice count toward your pool total (they replace regular dice, they don't add to it). Click dice on your latest roll to select them for a Willpower reroll.</div>
  </div>

  <div id="log">
    <div class="empty-state" id="emptyState">No rolls yet. Set your pool and hunger, then roll.</div>
  </div>

  <div class="log-toolbar">
    <button id="clearLog">Clear log</button>
  </div>
</div>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@2";

const EXT_ID = "com.vtm-hunger-dice";
const META_KEY = `${EXT_ID}/log`;
const MAX_LOG_ENTRIES = 150;

const poolInput = document.getElementById("poolInput");
const hungerInput = document.getElementById("hungerInput");
const poolColorInput = document.getElementById("poolColor");
const hungerColorInput = document.getElementById("hungerColor");
const rollBtn = document.getElementById("rollBtn");
const logEl = document.getElementById("log");
const emptyState = document.getElementById("emptyState");
const clearLogBtn = document.getElementById("clearLog");

// --- persisted local prefs (pool size, hunger size, colors) ---
function loadPrefs() {
  try {
    const raw = localStorage.getItem(`${EXT_ID}/prefs`);
    if (raw) {
      const p = JSON.parse(raw);
      if (p.pool) poolInput.value = p.pool;
      if (p.hunger !== undefined) hungerInput.value = p.hunger;
      if (p.poolColor) poolColorInput.value = p.poolColor;
      if (p.hungerColor) hungerColorInput.value = p.hungerColor;
    }
  } catch (e) {}
}
function savePrefs() {
  localStorage.setItem(`${EXT_ID}/prefs`, JSON.stringify({
    pool: poolInput.value,
    hunger: hungerInput.value,
    poolColor: poolColorInput.value,
    hungerColor: hungerColorInput.value,
  }));
}
loadPrefs();

function clampInputs() {
  let pool = Math.max(1, Math.min(20, parseInt(poolInput.value) || 1));
  let hunger = Math.max(0, Math.min(5, parseInt(hungerInput.value) || 0));
  if (hunger > pool) hunger = pool;
  poolInput.value = pool;
  hungerInput.value = hunger;
  savePrefs();
}

document.getElementById("poolMinus").onclick = () => { poolInput.value = Math.max(1, (parseInt(poolInput.value)||1) - 1); clampInputs(); };
document.getElementById("poolPlus").onclick = () => { poolInput.value = Math.min(20, (parseInt(poolInput.value)||1) + 1); clampInputs(); };
document.getElementById("hungerMinus").onclick = () => { hungerInput.value = Math.max(0, (parseInt(hungerInput.value)||0) - 1); clampInputs(); };
document.getElementById("hungerPlus").onclick = () => { hungerInput.value = Math.min(5, (parseInt(hungerInput.value)||0) + 1); clampInputs(); };
poolInput.onchange = clampInputs;
hungerInput.onchange = clampInputs;
poolColorInput.onchange = () => { savePrefs(); render(currentLog); };
hungerColorInput.onchange = () => { savePrefs(); render(currentLog); };

// --- VtM V5 roll evaluation ---
function rollD10() { return Math.floor(Math.random() * 10) + 1; }

function evaluateRoll(poolDice, hungerDice) {
  const all = [...poolDice, ...hungerDice];
  const tens = all.filter(d => d === 10).length;
  const pairs = Math.floor(tens / 2);
  const nonTenHits = all.filter(d => d >= 6 && d <= 9).length;
  const successes = nonTenHits + tens + pairs * 2;

  const hungerTens = hungerDice.filter(d => d === 10).length;
  const isCritPair = pairs > 0;
  const isMessy = isCritPair && hungerTens > 0;
  const hasHungerOne = hungerDice.some(d => d === 1);

  // Only Messy Critical and Bestial Failure carry a narrative complication worth
  // calling out explicitly — plain crits/successes/failures are already visible
  // from the die colors alone, so no tag for those.
  let outcome = null, outcomeClass = null;
  if (successes === 0 && hasHungerOne) {
    outcome = "Bestial Failure";
    outcomeClass = "bestial";
  } else if (isMessy) {
    outcome = "Messy Critical";
    outcomeClass = "messy";
  }

  return { successes, pairs, outcome, outcomeClass, hasHungerOne };
}

// --- rolling ---
async function doRoll() {
  clampInputs();
  const pool = parseInt(poolInput.value);
  const hunger = parseInt(hungerInput.value);
  const regularCount = pool - hunger;

  const poolDice = Array.from({ length: regularCount }, rollD10);
  const hungerDice = Array.from({ length: hunger }, rollD10);
  const evalResult = evaluateRoll(poolDice, hungerDice);

  const entry = {
    id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    playerId: currentPlayerId,
    playerName: currentPlayerName,
    playerColor: currentPlayerColor,
    poolDice,
    hungerDice,
    poolColorHex: poolColorInput.value,
    hungerColorHex: hungerColorInput.value,
    timestamp: Date.now(),
    ...evalResult,
  };

  await pushEntry(entry);
}

rollBtn.onclick = doRoll;

// --- log storage (room metadata = shared + persistent) ---
let currentLog = [];
let obrReady = false;
let currentPlayerId = null;
let currentPlayerName = "You";
let currentPlayerColor = "#888888";

// dice selected for a Willpower reroll, scoped to whichever entry id is "active" (the newest)
let selectedKeys = new Set();
let activeEntryId = null;

// entry ids we've already rendered once, so we don't replay the pop-in animation forever
const seenEntryIds = new Set();
const forceAnimateIds = new Set();

async function persistLog(next) {
  currentLog = next;
  if (obrReady) {
    try {
      await OBR.room.setMetadata({ [META_KEY]: next });
    } catch (e) {
      console.error("Failed to save roll to room metadata", e);
    }
  } else {
    localStorage.setItem(`${EXT_ID}/local-log`, JSON.stringify(next));
  }
}

async function pushEntry(entry) {
  const next = [entry, ...currentLog].slice(0, MAX_LOG_ENTRIES);
  activeEntryId = entry.id;
  selectedKeys = new Set();
  forceAnimateIds.add(entry.id);
  await persistLog(next);
  render(currentLog);
}

async function updateEntry(updatedEntry) {
  const next = currentLog.map(e => e.id === updatedEntry.id ? updatedEntry : e);
  forceAnimateIds.add(updatedEntry.id);
  await persistLog(next);
  render(currentLog);
}

clearLogBtn.onclick = async () => {
  seenEntryIds.clear();
  forceAnimateIds.clear();
  selectedKeys = new Set();
  activeEntryId = null;
  await persistLog([]);
  render(currentLog);
};

function timeString(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function dieKey(kind, idx) { return `${kind}-${idx}`; }

function render(log) {
  logEl.querySelectorAll(".entry").forEach(el => el.remove());
  emptyState.style.display = log.length === 0 ? "block" : "none";

  const topEntryId = log[0]?.id ?? null;
  if (topEntryId !== activeEntryId) {
    // top entry changed (e.g. someone else rolled) - selection no longer applies
    activeEntryId = topEntryId;
    selectedKeys = new Set();
  }

  log.forEach((entry, entryIdx) => {
    const el = document.createElement("div");
    el.className = "entry";

    const isTopEntry = entryIdx === 0;
    const isOwnEntry = entry.playerId ? entry.playerId === currentPlayerId : !obrReady;
    const isEditable = isTopEntry && isOwnEntry;

    const dice = [
      ...entry.poolDice.map((v, i) => ({ v, hunger: false, key: dieKey("pool", i) })),
      ...entry.hungerDice.map((v, i) => ({ v, hunger: true, key: dieKey("hunger", i) })),
    ];

    const shouldAnimate = !seenEntryIds.has(entry.id) || forceAnimateIds.has(entry.id);

    const diceHtml = dice.map((d, i) => {
      const isTen = d.v === 10;
      const isPairedTen = isTen && entry.pairs > 0;
      const isHungerOne = d.v === 1 && d.hunger;
      const isSuccessDie = d.v >= 6 && !isPairedTen;

      const cls = ["die"];
      if (isSuccessDie) cls.push("success");
      if (isPairedTen) cls.push("crit");
      if (isHungerOne) cls.push("hungerone");
      if (isEditable) cls.push("selectable");
      if (isEditable && selectedKeys.has(d.key)) cls.push("selected");
      if (shouldAnimate) cls.push("die-animate");

      const bg = d.hunger ? entry.hungerColorHex : entry.poolColorHex;
      const delay = shouldAnimate ? ` style="background:${bg};animation-delay:${i * 35}ms"` : ` style="background:${bg}"`;
      const dataAttrs = isEditable ? ` data-entryid="${entry.id}" data-key="${d.key}"` : "";
      return `<div class="${cls.join(' ')}"${delay}${dataAttrs}>${d.v}</div>`;
    }).join("");

    const tagLabel = entry.outcome ? entry.outcome.replace(" ", "<br>") : "";
    const tallyClass = entry.outcomeClass ? ` ${entry.outcomeClass}` : "";
    const tallyHtml = `
      <div class="tally-box${tallyClass}">
        <div class="tally-number">${entry.successes}</div>
        ${entry.outcome ? `<div class="tally-tag">${tagLabel}</div>` : ""}
      </div>`;

    const rerollHtml = isEditable
      ? `<div class="reroll-bar">
           <button class="reroll-btn" data-reroll-for="${entry.id}" ${selectedKeys.size === 0 ? "disabled style=\"opacity:0.4;cursor:default;\"" : ""}>
             Reroll Selected${selectedKeys.size ? ` (${selectedKeys.size})` : ""}
           </button>
           <span class="reroll-hint">click dice above to select</span>
         </div>`
      : "";

    el.innerHTML = `
      <div class="entry-header">
        <span class="entry-player" style="color:${entry.playerColor || '#ddd'}">${escapeHtml(entry.playerName)}</span>
        <span class="entry-time">${timeString(entry.timestamp)}</span>
      </div>
      <div class="entry-body">
        <div class="dice-row">${diceHtml}</div>
        ${tallyHtml}
      </div>
      ${rerollHtml}
    `;
    logEl.appendChild(el);
    seenEntryIds.add(entry.id);
  });

  forceAnimateIds.clear();
}

// event delegation: clicking a selectable die toggles selection; clicking reroll button rerolls
logEl.addEventListener("click", (e) => {
  const rerollBtn = e.target.closest(".reroll-btn[data-reroll-for]");
  if (rerollBtn) {
    const entryId = rerollBtn.dataset.rerollFor;
    if (entryId === activeEntryId && selectedKeys.size > 0) {
      rerollSelected(entryId);
    }
    return;
  }

  const dieEl = e.target.closest(".die.selectable[data-key]");
  if (!dieEl) return;
  if (dieEl.dataset.entryid !== activeEntryId) return;
  const key = dieEl.dataset.key;
  if (selectedKeys.has(key)) selectedKeys.delete(key);
  else selectedKeys.add(key);
  render(currentLog);
});

async function rerollSelected(entryId) {
  const entry = currentLog.find(e => e.id === entryId);
  if (!entry) return;

  const poolDice = [...entry.poolDice];
  const hungerDice = [...entry.hungerDice];

  for (const key of selectedKeys) {
    const [kind, idxStr] = key.split("-");
    const idx = parseInt(idxStr);
    if (kind === "pool") poolDice[idx] = rollD10();
    else if (kind === "hunger") hungerDice[idx] = rollD10();
  }

  const evalResult = evaluateRoll(poolDice, hungerDice);
  const updatedEntry = { ...entry, poolDice, hungerDice, ...evalResult };

  selectedKeys = new Set();
  await updateEntry(updatedEntry);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// --- init / OBR wiring ---
async function init() {
  try {
    if (OBR.isAvailable) {
      OBR.onReady(async () => {
        obrReady = true;
        try {
          currentPlayerId = await OBR.player.getId();
          currentPlayerName = await OBR.player.getName();
          currentPlayerColor = await OBR.player.getColor();
        } catch (e) {}

        try {
          const metadata = await OBR.room.getMetadata();
          currentLog = metadata[META_KEY] || [];
        } catch (e) {
          currentLog = [];
        }
        render(currentLog);

        OBR.room.onMetadataChange((metadata) => {
          currentLog = metadata[META_KEY] || [];
          render(currentLog);
        });
      });
      return;
    }
  } catch (e) {}

  // Fallback: running outside Owlbear Rodeo (e.g. local testing)
  obrReady = false;
  try {
    currentLog = JSON.parse(localStorage.getItem(`${EXT_ID}/local-log`) || "[]");
  } catch (e) {
    currentLog = [];
  }
  render(currentLog);
}

init();
</script>
</body>
</html>
